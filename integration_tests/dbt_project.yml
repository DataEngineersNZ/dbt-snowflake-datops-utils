name: 'dbt_dataengineers_utils_integration_tests'
version: '1.0.0'
config-version: 2

require-dbt-version: [">=1.8.0", "<3.0.0"]

profile: 'integration_tests'

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Exercises the var-level fallback tier of apply_data_metric_functions' schedule
  # resolution (model meta > this var > hardcoded '60 MINUTE' default).
  dmf_schedule: "45 MINUTE"

