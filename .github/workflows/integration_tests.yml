name: Integration Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# All runs of this workflow -- regardless of branch or PR -- share the same
# SNOWFLAKE_DATABASE/schema pair (DBT_CI_TESTS / DBT_CI_TESTS_FUSION). A fixed
# (branch-independent) concurrency group queues overlapping runs instead of
# letting them race against the same scratch objects (e.g. one run's teardown
# dropping a database role the other run is still granting/checking).
# queue: max is required here: the default (queue: single) only lets one run
# wait, and a third run arriving would cancel that pending run outright rather
# than queuing behind it, leaving that PR without a completed check.
concurrency:
  group: integration-tests-shared-snowflake-db
  queue: max

env:
  DBT_PROFILES_DIR: ${{ github.workspace }}/integration_tests

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        engine: [dbt-core, dbt-fusion]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        if: matrix.engine == 'dbt-core'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt-snowflake (dbt-core)
        if: matrix.engine == 'dbt-core'
        run: pip install "dbt-snowflake>=1.9.4,<2.0.0"

      - name: Install dbt Fusion
        if: matrix.engine == 'dbt-fusion'
        run: |
          curl -fsSL https://public.cdn.getdbt.com/fs/install/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Write private key
        run: |
          echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > /tmp/rsa_key.p8
          chmod 600 /tmp/rsa_key.p8

      - name: Create dbt profiles.yml
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
          CI_SCHEMA: ${{ matrix.engine == 'dbt-fusion' && 'DBT_CI_TESTS_FUSION' || 'DBT_CI_TESTS' }}
        run: |
          {
            echo "integration_tests:"
            echo "  target: ci"
            echo "  outputs:"
            echo "    ci:"
            echo "      type: snowflake"
            echo "      account: \"${SNOWFLAKE_ACCOUNT}\""
            echo "      user: \"${SNOWFLAKE_USER}\""
            echo "      authenticator: snowflake_jwt"
            echo "      private_key_path: /tmp/rsa_key.p8"
            if [ -n "$SNOWFLAKE_PRIVATE_KEY_PASSPHRASE" ]; then
              echo "      private_key_passphrase: \"${SNOWFLAKE_PRIVATE_KEY_PASSPHRASE}\""
            fi
            echo "      role: \"${SNOWFLAKE_ROLE}\""
            echo "      warehouse: \"${SNOWFLAKE_WAREHOUSE}\""
            echo "      database: \"${SNOWFLAKE_DATABASE}\""
            echo "      schema: ${CI_SCHEMA}"
            echo "      threads: 4"
          } > integration_tests/profiles.yml

      - name: Print dbt version
        working-directory: integration_tests
        run: dbt --version

      - name: Install dbt packages
        working-directory: integration_tests
        run: dbt deps

      - name: Run dbt build (models + tests)
        working-directory: integration_tests
        run: dbt build

      - name: Run macro unit tests
        working-directory: integration_tests
        run: |
          dbt run-operation test_has_matching_nodes
          dbt run-operation test_grants_helpers
          dbt run-operation test_grants_idempotency
          dbt run-operation test_clean_macros
          dbt run-operation test_database_role_macros
