version: 2

macros:
  - name: depends_on_ref
    description: This macro adds a commented reference to a reference model so downstream lineage remains implicit.
    docs:
      show: true
    arguments:
      - name: include_for
        type: string
        description: options include docs, run or all
      - name: model
        type: string
        description: the reference model to add

  - name: depends_on_source
    description: This macro adds a commented reference to a source model so downstream lineage remains implicit.
    docs:
      show: true
    arguments:
      - name: include_for
        type: string
        description: options include docs, run or all
      - name: schema
        type: string
        description: the schema for the source model to add
      - name: model
        type: string
        description: the source model to add
      - name: include_database
        type: boolean
        description: specify if the database name should be included

  - name: is_docs_generate_invocation
    description: |
      Internal helper used by depends_on_ref/depends_on_source to detect whether the current dbt
      invocation is `dbt docs generate`. flags.WHICH alone is unreliable for this on dbt Fusion, where
      it reports 'compile' for both `dbt compile` and `dbt docs generate`; this macro also parses the
      actual subcommand positionally out of the raw invocation command line as a second signal.
    docs:
      show: false
    arguments:
      - name: which
        type: string
        description: the current flags.WHICH value
      - name: invocation_command
        type: string
        description: the raw dbt invocation command line (invocation_args_dict.invocation_command)